name: Build-Padavan-K2P

on:
  #push:
   # branches:
   # - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # 升级到 ubuntu-24.04 以支持 GLIBC_2.36 和 GLIBC_2.38
    strategy:
      matrix:
        target: [K2P]
        toolchain: [mipsel-linux-musl]
    steps:
      - uses: actions/checkout@v3
        with:
          ref: dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23.0'
          check-latest: true
          cache: false
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          check-latest: true
      - name: Prepare
        run: |
          sudo apt update
          # 安装 xz-utils 和 liblzma-dev 以解决 lzma.h 缺失问题
          # 安装 libtool 和 libltdl-dev 以解决 libtoolize 错误
          sudo apt install -y libtool-bin gperf python3-docutils autopoint gettext ccache xz-utils liblzma-dev libtool libltdl-dev
      - name: Build
        run: |
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}
          path: trunk/images/*.trx
